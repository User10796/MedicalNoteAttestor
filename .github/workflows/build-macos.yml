name: Build macOS App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build app
        run: |
          xcodebuild -project MedicalNoteAttestor.xcodeproj \
            -scheme MedicalNoteAttestor \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Create app bundle
        run: |
          mkdir -p release
          cp -R "build/Build/Products/Release/MedicalNoteAttestor.app" release/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MedicalNoteAttestor-macOS
          path: release/MedicalNoteAttestor.app
          retention-days: 30
