name: Build macOS App

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Swift tests (shared core via JavaScriptCore, hotkeys)
        run: scripts/test-swift.sh

      - name: Build stamp script tests
        run: scripts/test-build-stamp.sh

      - name: Build app
        run: |
          xcodebuild -project MedicalNoteAttestor.xcodeproj \
            -scheme MedicalNoteAttestor \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Verify build stamp (present, non-empty, matches HEAD)
        run: |
          PL="build/Build/Products/Release/MedicalNoteAttestor.app/Contents/Info.plist"
          STAMP="$(/usr/libexec/PlistBuddy -c 'Print :MNABuildCommit' "$PL")"
          echo "MNABuildCommit=$STAMP MNABuildTime=$(/usr/libexec/PlistBuddy -c 'Print :MNABuildTime' "$PL")"
          test -n "$STAMP" || { echo "FATAL: build stamp missing"; exit 1; }
          case "$STAMP" in "$(git rev-parse --short HEAD)"|"$(git rev-parse --short HEAD)-dirty") ;; *) echo "FATAL: stamp $STAMP != HEAD"; exit 1;; esac

      - name: Create app bundle
        run: |
          mkdir -p release
          cp -R "build/Build/Products/Release/MedicalNoteAttestor.app" release/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MedicalNoteAttestor-macOS
          path: release/MedicalNoteAttestor.app
          retention-days: 30
