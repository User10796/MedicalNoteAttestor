# Builds macOS .app (unsigned) + Windows portable .exe on every tag push.
# Tag a release:  git tag v1.0.0 && git push --tags
name: Build MedicalNoteAttestor

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}   # manual "Run workflow" button

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build (unsigned, Release)
        run: |
          xcodebuild -project MedicalNoteAttestor.xcodeproj \
            -scheme "MedicalNoteAttestor" \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            build

      - name: Zip .app
        run: |
          APP=$(find build/Build/Products/Release -maxdepth 1 -name "*.app" | head -1)
          ditto -c -k --sequesterRsrc --keepParent "$APP" MedicalNoteAttestor-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: MedicalNoteAttestor-macOS
          path: MedicalNoteAttestor-macOS.zip

  build-windows:
    # The Electron project lives at the repo ROOT (package.json, main.js, scripts/,
    # autohotkey/) — not in a subfolder. No package-lock.json is committed, so use
    # `npm install`, not `npm ci`. Mirrors the proven-working build-windows.yml.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Stamp build info (version + commit)
        shell: bash
        run: node scripts/gen-build-info.js
        env:
          GIT_COMMIT: ${{ github.sha }}
          BUILD_RUN_NUMBER: ${{ github.run_number }}
      - run: npm run build     # electron-builder --win portable -> dist/MedicalNoteAttestor.exe
      - name: Verify exe exists
        shell: bash
        run: |
          if [ ! -f dist/MedicalNoteAttestor.exe ]; then
            echo "FATAL - dist/MedicalNoteAttestor.exe not produced"
            ls -la dist/
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: MedicalNoteAttestor-Windows
          path: dist/*.exe

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/MedicalNoteAttestor-macOS/*.zip
            artifacts/MedicalNoteAttestor-Windows/*.exe
          body: |
            **macOS**: unzip, right-click → Open the first time (unsigned build).
            **Windows**: portable .exe, no install needed. SmartScreen: More info → Run anyway.
