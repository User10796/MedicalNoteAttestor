name: Tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Tests use only Node built-ins (node:test); no npm install needed.
      - name: Unit tests
        run: npm test
