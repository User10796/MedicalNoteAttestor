<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'">
<title>Payer &amp; procedures</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px;
         color: #24292e; background: #f6f8fa; padding: 12px; }
  h1 { font-size: 13px; font-weight: 600; margin-bottom: 8px; display: flex; justify-content: space-between; }
  h1 small { font-weight: 400; color: #586069; }
  input[type=text], select { font-size: 13px; padding: 5px 6px; border: 1px solid #d1d5da; border-radius: 4px; background: #fff; }
  input[type=text] { width: 100%; }
  input:focus, select:focus { outline: 2px solid #0366d6; outline-offset: -1px; }
  .list { margin-top: 6px; max-height: 300px; overflow-y: auto; background: #fff; border: 1px solid #e1e4e8; border-radius: 4px; }
  .opt { padding: 5px 8px; cursor: pointer; display: flex; gap: 8px; align-items: center; }
  .opt.sel { background: #0366d6; color: #fff; }
  .opt .n { width: 16px; color: #959da5; font-size: 11px; text-align: right; }
  .opt.sel .n { color: #cfe3fb; }
  .opt .pin { font-size: 10px; color: #b08800; }
  .opt.sel .pin { color: #ffe08a; }
  .hint { color: #586069; font-size: 11px; margin-top: 6px; }
  .payer { background: #fff; border: 1px solid #e1e4e8; border-radius: 4px; padding: 6px 8px; margin-bottom: 8px;
           display: flex; justify-content: space-between; align-items: center; }
  .rows { display: flex; flex-direction: column; gap: 6px; }
  .row { display: flex; gap: 6px; align-items: center; background: #fff; border: 1px solid #e1e4e8; border-radius: 4px; padding: 6px; }
  .row.off { opacity: .6; }
  .row select.proc { flex: 1; min-width: 0; }
  .row .tag { font-size: 10px; color: #586069; }
  .x { border: none; background: none; font-size: 15px; cursor: pointer; color: #959da5; padding: 0 4px; }
  .notices { margin-top: 8px; display: flex; flex-direction: column; gap: 4px; }
  .notice { font-size: 12px; padding: 4px 8px; border-radius: 4px; background: #f1f8ff; border-left: 3px solid #0366d6; }
  .notice.amber { background: #fffbdd; border-left-color: #dbab09; }
  .notice.red { background: #ffeef0; border-left-color: #cb2431; }
  .empty { color: #586069; font-style: italic; margin-bottom: 6px; }
  .btns { display: flex; justify-content: space-between; margin-top: 10px; gap: 8px; }
  button.b { padding: 6px 14px; border-radius: 4px; border: 1px solid #d1d5da; background: #fafbfc; cursor: pointer; font-size: 13px; }
  button.primary { background: #2ea44f; color: #fff; border-color: #2a8f47; }
  button.link { border: none; background: none; color: #0366d6; cursor: pointer; font-size: 12px; }
  .hidden { display: none; }
</style>
</head>
<body>
  <section id="step-payer">
    <h1>Payer <small id="src"></small></h1>
    <input type="text" id="q" placeholder="Type payer name or alias (e.g. Medicare, BCBS, PSHP)" autocomplete="off" spellcheck="false">
    <div class="list" id="list"></div>
    <div class="hint" id="payer-hint">Enter = choose &middot; 1&ndash;9, 0 = recent payer &middot; Esc = Skip (paste as usual, no library text)</div>
    <div class="btns"><button class="b" id="skip1">Skip (Esc)</button><span></span></div>
  </section>

  <section id="step-proc" class="hidden">
    <div class="payer"><span>Payer: <strong id="payer-name"></strong></span><button class="link" id="change-payer">change</button></div>
    <div id="none" class="empty hidden">No procedure detected. Pick one below, or Skip.</div>
    <div class="rows" id="rows"></div>
    <button class="link" id="add" style="margin-top:6px">+ add procedure</button>
    <div class="notices" id="notices"></div>
    <div class="btns">
      <button class="b" id="skip2">Skip (Esc)</button>
      <button class="b primary" id="insert">Insert (Enter)</button>
    </div>
  </section>

  <script src="lib/mna-core.js"></script>
  <script src="picker.js"></script>
</body>
</html>
