<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Note Attestor</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .title-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 8px;
            background: #f0f0f0;
            border-bottom: 1px solid #ddd;
            cursor: move;
            user-select: none;
            flex-shrink: 0;
            -webkit-app-region: drag;
        }

        .title-bar-text {
            font-size: 12px;
            font-weight: 600;
            color: #555;
        }

        .collapse-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
            color: #666;
            padding: 2px 6px;
            border-radius: 3px;
            line-height: 1;
            -webkit-app-region: no-drag;
        }

        .collapse-btn:hover {
            background: #ddd;
            color: #333;
        }

        .collapsible-content {
            display: flex;
            flex-direction: column;
            flex: 1;
            overflow: hidden;
            transition: opacity 0.15s ease;
            padding: 12px;
        }

        .collapsible-content.collapsed {
            display: none;
        }

        .header {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }

        .header h1 {
            font-size: 14px;
            color: #24292e;
        }

        .header .spinner {
            margin-left: auto;
            display: none;
            width: 16px;
            height: 16px;
            border: 2px solid #e1e4e8;
            border-top: 2px solid #0366d6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .status {
            font-size: 11px;
            color: #586069;
            margin-bottom: 8px;
            min-height: 16px;
        }

        .status.success { color: #22863a; }
        .status.error { color: #cb2431; }

        .tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 8px;
            border-bottom: 1px solid #e1e4e8;
            padding-bottom: 6px;
        }

        .tab {
            padding: 4px 10px;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 12px;
            color: #586069;
            border-radius: 4px;
        }

        .tab.active {
            background: #0366d6;
            color: white;
        }

        .tab:hover:not(.active) {
            background: #f3f4f6;
        }

        .tab-content {
            display: none;
            flex: 1;
            flex-direction: column;
            min-height: 0;
        }

        .tab-content.active {
            display: flex;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
        }

        .btn-primary {
            background: #0366d6;
            color: white;
        }

        .btn-primary:hover {
            background: #0256b9;
        }

        .btn-primary:disabled {
            background: #a0c4e8;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #fafbfc;
            border: 1px solid #e1e4e8;
            color: #24292e;
        }

        .btn-secondary:hover {
            background: #f3f4f6;
        }

        .btn-select {
            width: 100%;
            padding: 10px;
            background: #0366d6;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-bottom: 8px;
        }

        .btn-select:hover {
            background: #0256b9;
        }

        .btn-select:disabled {
            background: #a0c4e8;
            cursor: not-allowed;
        }

        .output-area {
            flex: 1;
            background: white;
            border: 1px solid #e1e4e8;
            border-radius: 6px;
            padding: 8px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 11px;
            color: #24292e;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            min-height: 0;
            user-select: text;
        }

        .bottom-controls {
            display: flex;
            align-items: center;
            margin-top: 8px;
            gap: 8px;
        }

        .bottom-controls label {
            font-size: 11px;
            color: #586069;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .btn-sm {
            padding: 4px 10px;
            border: 1px solid #e1e4e8;
            background: #fafbfc;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            color: #24292e;
        }

        .btn-sm:hover {
            background: #f3f4f6;
        }

        .spacer {
            flex: 1;
        }

        /* Heidi tab */
        .heidi-info {
            font-size: 12px;
            color: #586069;
            line-height: 1.6;
            padding: 12px;
        }

        .heidi-info h3 {
            font-size: 13px;
            color: #24292e;
            margin-bottom: 8px;
        }

        .heidi-info kbd {
            background: #f1f1f1;
            border: 1px solid #ccc;
            border-radius: 3px;
            padding: 1px 6px;
            font-family: 'Consolas', monospace;
            font-size: 11px;
        }

        #heidi-status {
            font-size: 11px;
            margin-top: 12px;
            min-height: 16px;
        }

        .hotkey-display {
            background: #f1f1f1;
            border: 1px solid #ccc;
            border-radius: 3px;
            padding: 1px 6px;
            font-family: 'Consolas', monospace;
            font-size: 10px;
        }

        .slot-card {
            display: flex; align-items: flex-start; gap: 10px;
            background: white; border: 1px solid #e1e4e8;
            border-radius: 6px; padding: 10px; margin-bottom: 8px;
            transition: background 0.3s, border-color 0.3s;
        }
        .slot-card.highlighted { background: #ddf4ff; border-color: #0366d6; }
        .slot-icon { font-size: 15px; padding-top: 2px; flex-shrink: 0; }
        .slot-body { flex: 1; min-width: 0; }
        .slot-label {
            font-size: 12px; font-weight: 600; color: #586069;
            margin-bottom: 2px; display: flex; align-items: center; gap: 6px;
        }
        .slot-preview {
            font-size: 11px; color: #24292e; font-family: 'Consolas', monospace;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .slot-preview.empty { color: #959da5; font-style: italic; }
        .slot-copy-btn { font-size: 11px; padding: 3px 8px; flex-shrink: 0; align-self: flex-start; }
        .capture-btn { width: 100%; margin-bottom: 8px; padding: 10px; font-size: 14px; }
        .paste-legend { font-size: 11px; color: #959da5; text-align: center; margin-top: 6px; }
        .capture-note {
            font-size: 11px; color: #586069; background: #f6f8fa;
            border: 1px solid #e1e4e8; border-radius: 4px;
            padding: 8px 10px; margin-bottom: 10px; line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="title-bar">
        <span class="title-bar-text">Medical Note Attestor</span>
        <button class="collapse-btn" id="collapse-btn" title="Collapse/Expand">▲</button>
    </div>

    <div class="collapsible-content" id="collapsible-content">
    <div class="header">
        <h1>Medical Note Attestor</h1>
        <div class="spinner" id="spinner"></div>
    </div>

    <div class="status" id="status"></div>

    <div class="tabs">
        <button class="tab active" data-tab="attestor">Attestor</button>
        <button class="tab" data-tab="heidi">Heidi Copy</button>
    </div>

    <!-- Attestor Tab -->
    <div id="attestor-tab" class="tab-content active">
        <button class="btn-select" id="select-btn">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
                <rect x="2" y="2" width="12" height="12" rx="1" stroke-dasharray="3 2"/>
            </svg>
            Select
        </button>

        <div class="output-area" id="output">Click 'Select' to capture screen text...</div>

        <div class="bottom-controls">
            <label>
                <input type="checkbox" id="auto-copy">
                Auto-copy
            </label>
            <span class="spacer"></span>
            <button class="btn-sm" id="copy-btn">Copy</button>
            <button class="btn-sm" id="clear-btn">Clear</button>
        </div>
    </div>

    <!-- Heidi Copy Tab -->
    <div id="heidi-tab" class="tab-content">
        <div class="capture-note">
            Click into your Heidi note, then press
            <kbd id="capture-key-label">F8</kbd>.<br>
            Ctrl+A and Ctrl+C fire automatically.
        </div>

        <!-- Slot order: HPI → Exam → A/P -->
        <div class="slot-card" id="slot-hpi">
            <div class="slot-icon" id="hpi-icon">&#9898;</div>
            <div class="slot-body">
                <div class="slot-label">HPI
                    <span class="hotkey-display" id="paste1-key-label">F9</span>
                </div>
                <div class="slot-preview empty" id="hpi-preview">Empty</div>
            </div>
            <button class="btn btn-secondary slot-copy-btn"
                    onclick="manualCopySlot('hpi')">Copy</button>
        </div>

        <div class="slot-card" id="slot-exam">
            <div class="slot-icon" id="exam-icon">&#9898;</div>
            <div class="slot-body">
                <div class="slot-label">Exam
                    <span class="hotkey-display" id="paste2-key-label">F10</span>
                </div>
                <div class="slot-preview empty" id="exam-preview">Configure in Settings &rarr; Heidi Copy</div>
            </div>
            <button class="btn btn-secondary slot-copy-btn"
                    onclick="manualCopySlot('exam')">Copy</button>
        </div>

        <div class="slot-card" id="slot-ap">
            <div class="slot-icon" id="ap-icon">&#9898;</div>
            <div class="slot-body">
                <div class="slot-label">A/P
                    <span class="hotkey-display" id="paste3-key-label">F11</span>
                </div>
                <div class="slot-preview empty" id="ap-preview">Empty</div>
            </div>
            <button class="btn btn-secondary slot-copy-btn"
                    onclick="manualCopySlot('ap')">Copy</button>
        </div>

        <button id="capture-btn" class="btn btn-primary capture-btn"
                onclick="triggerCapture()">&#128203; Capture Note</button>

        <div style="display:flex; gap:8px; margin-bottom:4px;">
            <button class="btn btn-secondary" style="flex:1"
                    onclick="clearSlots()">Clear</button>
        </div>

        <div class="paste-legend" id="paste-legend">
            F9 HPI &nbsp;&middot;&nbsp; F10 Exam &nbsp;&middot;&nbsp; F11 A/P
        </div>

        <div id="heidi-status" class="status"
             style="margin-top:10px; text-align:center;"></div>
    </div>

    </div><!-- /.collapsible-content -->

    <script src="renderer.js"></script>
</body>
</html>
