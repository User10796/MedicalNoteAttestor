<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'">
    <title>Claude fill</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, "Segoe UI", sans-serif; font-size: 13px; background: #2b2b2b; color: #fff;
               padding: 12px 14px; height: 100vh; overflow: hidden; -webkit-app-region: drag; border-radius: 8px; }
        #title { font-size: 11px; color: #bbb; margin-bottom: 4px; }
        #stage { font-weight: 600; min-height: 34px; line-height: 17px; }
        #stage.error { color: #ff8a80; }
        #stage.done { color: #a5d6a7; }
        #row { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
        #elapsed { color: #bbb; font-variant-numeric: tabular-nums; }
        button { -webkit-app-region: no-drag; background: #555; color: #fff; border: 0; border-radius: 4px; padding: 4px 12px;
                 font-size: 12px; cursor: pointer; }
        button:hover { background: #666; }
        #bar { height: 3px; background: #444; border-radius: 2px; margin-top: 6px; overflow: hidden; }
        #fill { height: 100%; width: 0; background: #64b5f6; transition: width 0.2s; }
    </style>
</head>
<body>
    <div id="title">Claude fill</div>
    <div id="stage">Sending to Claude</div>
    <div id="bar"><div id="fill"></div></div>
    <div id="row">
        <span id="elapsed">0 s</span>
        <button id="cancel" title="Stop; paste the library text with its blanks unfilled">Cancel</button>
        <button id="close" style="display:none">Close</button>
    </div>
    <script src="fill-progress.js"></script>
</body>
</html>
